    * { box-sizing: border-box; }
    body { margin: 0; padding: 56px 20px; font-family: system-ui, sans-serif; color: #172033; background: #f3f6fb; }
    main { max-width: 720px; margin: 0 auto; }

    h2 { margin: 0 0 16px; font-size: 21px; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a { display: block; padding: 15px 18px; border-radius: 9px; background: #edf3ff; color: #2156b8; text-decoration: none; font-weight: 600; }
    a:hover { background: #dce8ff; }
    a:focus-visible { outline: 3px solid #2156b8; outline-offset: 3px; }
  </style>
</head>
